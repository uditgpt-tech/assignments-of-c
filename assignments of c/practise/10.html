<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Registration</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f1f1;
      padding: 20px;
    }

    h2 {
      text-align: center;
      color: #333;
    }

    form {
      background: #fff;
      padding: 20px;
      max-width: 600px;
      margin: auto;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    input[type="radio"], input[type="checkbox"] {
      width: auto;
    }

    .error {
      color: red;
      font-size: 0.9em;
    }

    .success {
      color: green;
      text-align: center;
      font-weight: bold;
      margin-top: 10px;
    }

    .btns {
      display: flex;
      justify-content: space-between;
    }

    .btns button {
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .btns button:hover {
      opacity: 0.9;
    }

    .generate-btn {
      margin-top: 6px;
      background-color: #5cb85c;
      color: white;
    }

    .submit-btn {
      background-color: #007bff;
      color: white;
    }

    .reset-btn {
      background-color: #dc3545;
      color: white;
    }
  </style>
</head>
<body>

  <h2>Student Registration Form</h2>

  <form id="regForm">
    <div class="form-group">
      <label for="fullname">Full Name:</label>
      <input type="text" id="fullname" name="fullname" required />
      <div class="error" id="errorFullname"></div>
    </div>

    <div class="form-group">
      <label for="email">Email Address:</label>
      <input type="email" id="email" name="email" required />
      <div class="error" id="errorEmail"></div>
    </div>

    <div class="form-group">
      <label for="mobile">Mobile Number:</label>
      <input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}" required />
      <div class="error" id="errorMobile"></div>
    </div>

    <div class="form-group">
      <label for="dob">Date of Birth:</label>
      <input type="date" id="dob" name="dob" required />
      <div class="error" id="errorDOB"></div>
    </div>

    <div class="form-group">
      <label>Gender:</label>
      <input type="radio" name="gender" value="Male" required /> Male
      <input type="radio" name="gender" value="Female" /> Female
      <input type="radio" name="gender" value="Other" /> Other
      <div class="error" id="errorGender"></div>
    </div>

    <div class="form-group">
      <label for="course">Course Selection:</label>
      <select id="course" name="course" required>
        <option value="">-- Select --</option>
        <option value="BCA">BCA</option>
        <option value="B.Tech">B.Tech</option>
        <option value="BBA">BBA</option>
        <option value="MCA">MCA</option>
        <option value="MBA">MBA</option>
      </select>
      <div class="error" id="errorCourse"></div>
    </div>

    <div class="form-group">
      <label>Skills:</label>
      <input type="checkbox" name="skills" value="HTML" /> HTML
      <input type="checkbox" name="skills" value="CSS" /> CSS
      <input type="checkbox" name="skills" value="JavaScript" /> JavaScript
      <input type="checkbox" name="skills" value="Python" /> Python
      <input type="checkbox" name="skills" value="C++" /> C++
      <div class="error" id="errorSkills"></div>
    </div>

    <div class="form-group">
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" required minlength="8" />
      <button type="button" class="generate-btn" onclick="generatePassword()">Generate Password</button>
      <div class="error" id="errorPassword"></div>
    </div>

    <div class="form-group">
      <label for="confirm">Confirm Password:</label>
      <input type="password" id="confirm" name="confirm" required />
      <div class="error" id="errorConfirm"></div>
    </div>

    <div class="btns">
      <button type="submit" class="submit-btn">Submit</button>
      <button type="reset" class="reset-btn">Reset</button>
    </div>

    <div class="success" id="successMessage"></div>

    <div class="success" id="userDetails"></div> /*name and reg*/
  </form>

  <script>
    const form = document.getElementById("regForm");

    document.getElementById("fullname").addEventListener("blur", () => {
      const nameField = document.getElementById("fullname");
      nameField.value = nameField.value.toUpperCase();
    });

    function generatePassword() {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$!";
      let pwd = "";
      for (let i = 0; i < 10; i++) {
        pwd += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      document.getElementById("password").value = pwd;
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      let isValid = true;

 
      document.querySelectorAll(".error").forEach(el => el.textContent = "");
      document.getElementById("successMessage").textContent = "";

      const fullname = document.getElementById("fullname").value.trim();
      if (fullname === "") {
        isValid = false;
        document.getElementById("errorFullname").textContent = "Full Name is required.";
      }


      const email = document.getElementById("email").value;
      if (!email.includes("@")) {
        isValid = false;
        document.getElementById("errorEmail").textContent = "Enter valid email.";
      }


      const mobile = document.getElementById("mobile").value;
      if (!/^\d{10}$/.test(mobile)) {
        isValid = false;
        document.getElementById("errorMobile").textContent = "Enter valid 10-digit mobile number.";
      }

      const dob = document.getElementById("dob").value;
      if (!dob) {
        isValid = false;
        document.getElementById("errorDOB").textContent = "DOB is required.";
      }

      
      if (!document.querySelector('input[name="gender"]:checked')) {
        isValid = false;
        document.getElementById("errorGender").textContent = "Select gender.";
      }

  
      const course = document.getElementById("course").value;
      if (course === "") {
        isValid = false;
        document.getElementById("errorCourse").textContent = "Select a course.";
      }

 
      const skills = document.querySelectorAll('input[name="skills"]:checked');
      if (skills.length === 0) {
        isValid = false;
        document.getElementById("errorSkills").textContent = "Select at least one skill.";
      }

      
      const pwd = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;

      if (pwd.length < 8 || !/[A-Z]/.test(pwd) || !/[a-z]/.test(pwd) || !/\d/.test(pwd)) {
        isValid = false;
        document.getElementById("errorPassword").textContent = "Weak password. Include upper, lower, digit.";
      }

      if (pwd !== confirm) {
        isValid = false;
        document.getElementById("errorConfirm").textContent = "Passwords do not match.";
      }

      if (isValid) {
        document.getElementById("successMessage").textContent = "🎉 Registration Successful!";
        document.getElementById("userDetails").innerHTML = "Submitted by: <strong>UDIT GUPTA</strong><br>Reg. No: <strong>REG. NO. 23BCE11527</strong>";
        form.reset();
}

    });
  </script>
</body>
</html>
